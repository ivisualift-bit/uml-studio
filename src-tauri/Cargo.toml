[package]
name = "uml-studio"
version = "0.1.0"
description = "UML Studio — local-first semantic UML modeler"
authors = ["UML Studio contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "uml_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
